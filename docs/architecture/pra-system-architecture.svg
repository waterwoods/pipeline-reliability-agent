<rect x="1564" y="42" width="26" height="14" rx="2" fill="#fffdf8" stroke="#1e3a5f" stroke-width="2"/>
<text x="1600" y="54" fill="#1c1917" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="1600" dy="0">Public showcase</tspan></text>
<rect x="1564" y="66" width="26" height="14" rx="2" fill="#fffdf8" stroke="#78716c" stroke-width="1.75" stroke-dasharray="5 4"/>
<text x="1600" y="78" fill="#1c1917" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="1600" dy="0">Private integration lab</tspan></text>
<rect x="28" y="124" width="356" height="118" rx="6" fill="#fffdf8" stroke="#78716c" stroke-width="1.75" stroke-dasharray="6 4"/>
<text x="44" y="156" fill="#1c1917" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="44" dy="0">Python / FastAPI</tspan></text>
<text x="44" y="184" fill="#57534e" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="44" dy="0">POST /v1/reliability/runs</tspan><tspan x="44" dy="22.08">Postgres checkpoint is opt-in</tspan></text>
<rect x="28" y="260" width="356" height="128" rx="6" fill="#fffdf8" stroke="#1e3a5f" stroke-width="2"/>
<text x="44" y="292" fill="#1c1917" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="44" dy="0">Mock adapter</tspan></text>
<text x="44" y="320" fill="#57534e" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="44" dy="0">Public default. No live cloud.</tspan></text>
<rect x="28" y="406" width="356" height="200" rx="6" fill="#fffdf8" stroke="#78716c" stroke-width="1.75" stroke-dasharray="6 4"/>
<text x="44" y="484" fill="#1c1917" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="44" dy="0">Adapters</tspan></text>
<text x="44" y="512" fill="#57534e" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="44" dy="0">Airflow · BigQuery · Databricks</tspan><tspan x="44" dy="24.84">Private lab. Not the API default.</tspan></text>
<rect x="460" y="124" width="980" height="518" rx="8" fill="#fffdf8" stroke="#1e3a5f" stroke-width="2"/>
<text x="484" y="152" fill="#1e3a5f" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">PRA RELIABILITY AGENT</text>
<text x="484" y="174" fill="#57534e" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="484" dy="0">Public loop. Apply writes each observation back into State.</tspan></text>
<rect x="484" y="196" width="300" height="86" rx="6" fill="#eef3f8" stroke="#1e3a5f" stroke-width="1.75"/>
<text x="500" y="228" fill="#1c1917" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="500" dy="0">Optional model</tspan></text>
<text x="500" y="256" fill="#57534e" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="500" dy="0">Validated facts. Cannot authorize.</tspan></text>
<rect x="900" y="196" width="250" height="86" rx="6" fill="#fffdf8" stroke="#1e3a5f" stroke-width="1.75"/>
<text x="916" y="228" fill="#1c1917" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="916" dy="0">Human approval</tspan></text>
<text x="916" y="256" fill="#57534e" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="916" dy="0">Still enters Guard.</tspan></text>
<rect x="484" y="328" width="220" height="118" rx="6" fill="#fffdf8" stroke="#1e3a5f" stroke-width="1.75"/>
<text x="500" y="360" fill="#1c1917" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="500" dy="0">Observe</tspan></text>
<text x="500" y="388" fill="#57534e" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="500" dy="0">Reads run, log, warehouse.</tspan></text>
<rect x="760" y="328" width="220" height="118" rx="6" fill="#1e3a5f" stroke="#1e3a5f" stroke-width="2"/>
<text x="776" y="360" fill="#fffdf8" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="776" dy="0">Decide</tspan></text>
<text x="776" y="388" fill="#f3e4da" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="776" dy="0">Rules propose the action.</tspan></text>
<rect x="1056" y="304" width="280" height="154" rx="6" fill="#9a3412" stroke="#1e3a5f" stroke-width="2.75"/>
<text x="1072" y="336" fill="#fffdf8" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start"><tspan x="1072" dy="0">Guard</tspan></text>
<text x="1072" y="364" fill="#f3e4da" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="1072" dy="0">Authorizes or denies.</tspan><tspan x="1072" dy="22.08">Retry, backfill, repair.</tspan></text>
<rect x="1056" y="500" width="280" height="112" rx="6" fill="#3f6212" stroke="#1e3a5f" stroke-width="2"/>
<text x="1072" y="532" fill="#fffdf8" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="1072" dy="0">Execute</tspan></text>
<text x="1072" y="560" fill="#f3e4da" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="1072" dy="0">The only side effect.</tspan></text>
<rect x="1468" y="124" width="424" height="518" rx="8" fill="#fffdf8" stroke="#d6d0c6" stroke-width="1.5"/>
<text x="1488" y="152" fill="#57534e" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">RESULT OF THE BRANCH</text>
<rect x="1488" y="176" width="384" height="196" rx="6" fill="#fdf4ef" stroke="#9a3412" stroke-width="2"/>
<text x="1504" y="294" fill="#1c1917" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start"><tspan x="1504" dy="0">STOP_SAFE</tspan></text>
<text x="1504" y="322" fill="#57534e" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start"><tspan x="1504" dy="0">No second write.</tspan><tspan x="1504" dy="23.46">FAILED job, 3,000 rows. RETRY blocked.</tspan></text>
<rect x="1488" y="488" width="384" height="124" rx="6" fill="#f4f7ee" stroke="#3f6212" stroke-width="2"/>
<text x="1504" y="520" fill="#1c1917" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="1504" dy="0">One authorized call</tspan></text>
<text x="1504" y="548" fill="#57534e" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start"><tspan x="1504" dy="0">Retry, repair, or backfill.</tspan></text>
<text x="28" y="748" fill="#57534e" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">SUPPORTING CONTROLS</text>
<rect x="28" y="766" width="640" height="200" rx="6" fill="#fffdf8" stroke="#9a3412" stroke-width="2"/>
<text x="44" y="844" fill="#1c1917" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="44" dy="0">Reconcile</tspan></text>
<text x="44" y="872" fill="#57534e" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start"><tspan x="44" dy="0">Check the run first. Do not replay.</tspan></text>
<rect x="760" y="766" width="680" height="200" rx="6" fill="#fffdf8" stroke="#1e3a5f" stroke-width="2"/>
<text x="776" y="844" fill="#1c1917" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="776" dy="0">File checkpoint</tspan></text>
<text x="776" y="872" fill="#57534e" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start"><tspan x="776" dy="0">UNKNOWN is saved before the call.</tspan></text>
<rect x="1468" y="766" width="424" height="104" rx="6" fill="#eef3f8" stroke="#1e3a5f" stroke-width="2"/>
<text x="1484" y="798" fill="#1c1917" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="1484" dy="0">Safety tests</tspan></text>
<text x="1484" y="826" fill="#57534e" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="1484" dy="0">Public guard and crash proofs.</tspan></text>
<rect x="1468" y="882" width="424" height="84" rx="6" fill="#fffdf8" stroke="#78716c" stroke-width="1.75" stroke-dasharray="6 4"/>
<text x="1484" y="914" fill="#1c1917" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="1484" dy="0">Eval gate</tspan></text>
<text x="1484" y="942" fill="#57534e" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="1484" dy="0">Private catalog and CI. Scripted cases.</tspan></text>
<text x="960" y="1040" fill="#78716c" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle"><tspan x="960" dy="0">Public code does not call live cloud systems. Not a customer deployment.</tspan></text>
