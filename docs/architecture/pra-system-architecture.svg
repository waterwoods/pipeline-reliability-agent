<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">PRA system architecture</title>
<desc id="desc">Public loop is Observe, Decide, Guard, Execute. Guard authorizes a side effect. FastAPI, Airflow, BigQuery, and Databricks are private and opt-in. A partial write stops before a second write.</desc>
<rect width="1920" height="1080" fill="#f3f0e9"/>
<defs>
  <marker id="arrow-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e3a5f"/></marker>
  <marker id="arrow-rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a3412"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3f6212"/></marker>
</defs>
<text x="36" y="36" fill="#9a3412" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">PIPELINE RELIABILITY AGENT</text>
<text x="36" y="70" fill="#1c1917" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start"><tspan x="36" dy="0">System architecture</tspan></text>
<text x="36" y="98" fill="#57534e" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="36" dy="0">Connects data systems. Diagnoses the failure. Guard stops an unsafe write.</tspan></text>
