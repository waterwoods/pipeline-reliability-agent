<svg id="pra" xmlns="http://www.w3.org/2000/svg" viewBox="-5 -343 1050.0078125 686" width="1050" height="686" role="graphics-document document" aria-roledescription="block"><title>Pipeline Reliability Agent architecture</title><desc>State flows through Decide, Guard, Execute, Observation, Apply, and Trace. Decide proposes, Guard authorizes, Execute performs. Human input still goes through Guard. Bedrock proposes facts only. Airflow is a tool boundary. UNKNOWN is persisted before a side effect. Resume reconciles before another retry.</desc><style>#pra{font-size:22px;fill:#1c1917;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#pra .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#pra .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#pra .error-icon{fill:hsl(220.5882352941, 100%, 98.3333333333%);}#pra .error-text{fill:rgb(8.5000000002, 5.7500000001, 0);stroke:rgb(8.5000000002, 5.7500000001, 0);}#pra .edge-thickness-normal{stroke-width:1px;}#pra .edge-thickness-thick{stroke-width:3.5px;}#pra .edge-pattern-solid{stroke-dasharray:0;}#pra .edge-thickness-invisible{stroke-width:0;fill:none;}#pra .edge-pattern-dashed{stroke-dasharray:3;}#pra .edge-pattern-dotted{stroke-dasharray:2;}#pra .marker{fill:#1e3a5f;stroke:#1e3a5f;}#pra .marker.cross{stroke:#1e3a5f;}#pra svg{font-size:22px;}#pra p{margin:0;}#pra .label{color:#333;}#pra .cluster-label text{fill:rgb(8.5000000002, 5.7500000001, 0);}#pra .cluster-label span,#pra p{color:rgb(8.5000000002, 5.7500000001, 0);}#pra .label text,#pra span,#pra p{fill:#333;color:#333;}#pra .node rect,#pra .node circle,#pra .node ellipse,#pra .node polygon,#pra .node path{fill:#fff4dd;stroke:hsl(40.5882352941, 60%, 83.3333333333%);stroke-width:1px;}#pra .flowchart-label text{text-anchor:middle;}#pra .node .label{text-align:center;}#pra .node.clickable{cursor:pointer;}#pra .arrowheadPath{fill:#000207;}#pra .edgePath .path{stroke:#1e3a5f;stroke-width:2.0px;}#pra .flowchart-link{stroke:#1e3a5f;fill:none;}#pra .edgeLabel{background-color:hsl(-79.4117647059, 100%, 93.3333333333%);text-align:center;}#pra .edgeLabel rect{opacity:0.5;background-color:hsl(-79.4117647059, 100%, 93.3333333333%);fill:hsl(-79.4117647059, 100%, 93.3333333333%);}#pra .labelBkg{background-color:rgba(243.9999999999, 220.9999999998, 255, 0.5);}#pra .node .cluster{fill:rgba(246.4999999998, 249.2499999999, 255, 0.5);stroke:rgba(207.3999999999, 218.9499999999, 243.1, 0.2);box-shadow:rgba(50, 50, 93, 0.25) 0px 13px 27px -5px,rgba(0, 0, 0, 0.3) 0px 8px 16px -8px;stroke-width:1px;}#pra .cluster text{fill:rgb(8.5000000002, 5.7500000001, 0);}#pra .cluster span,#pra p{color:rgb(8.5000000002, 5.7500000001, 0);}#pra div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-size:12px;background:hsl(220.5882352941, 100%, 98.3333333333%);border:1px solid hsl(220.5882352941, 60%, 88.3333333333%);border-radius:2px;pointer-events:none;z-index:100;}#pra .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#1c1917;}#pra .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#pra .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#pra :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}#pra .banner rect{fill:#1c1917!important;stroke:#1c1917!important;color:#fffdf8!important;}#pra .banner polygon{fill:#1c1917!important;stroke:#1c1917!important;color:#fffdf8!important;}#pra .banner ellipse{fill:#1c1917!important;stroke:#1c1917!important;color:#fffdf8!important;}#pra .banner circle{fill:#1c1917!important;stroke:#1c1917!important;color:#fffdf8!important;}#pra .banner path{fill:#1c1917!important;stroke:#1c1917!important;color:#fffdf8!important;}#pra .banner tspan{fill:#fffdf8!important;}#pra .propose rect{fill:#1e3a5f!important;stroke:#1e3a5f!important;color:#fffdf8!important;}#pra .propose polygon{fill:#1e3a5f!important;stroke:#1e3a5f!important;color:#fffdf8!important;}#pra .propose ellipse{fill:#1e3a5f!important;stroke:#1e3a5f!important;color:#fffdf8!important;}#pra .propose circle{fill:#1e3a5f!important;stroke:#1e3a5f!important;color:#fffdf8!important;}#pra .propose path{fill:#1e3a5f!important;stroke:#1e3a5f!important;color:#fffdf8!important;}#pra .propose tspan{fill:#fffdf8!important;}#pra .authorize rect{fill:#9a3412!important;stroke:#9a3412!important;color:#fffdf8!important;}#pra .authorize polygon{fill:#9a3412!important;stroke:#9a3412!important;color:#fffdf8!important;}#pra .authorize ellipse{fill:#9a3412!important;stroke:#9a3412!important;color:#fffdf8!important;}#pra .authorize circle{fill:#9a3412!important;stroke:#9a3412!important;color:#fffdf8!important;}#pra .authorize path{fill:#9a3412!important;stroke:#9a3412!important;color:#fffdf8!important;}#pra .authorize tspan{fill:#fffdf8!important;}#pra .perform rect{fill:#3f6212!important;stroke:#365314!important;color:#fffdf8!important;}#pra .perform polygon{fill:#3f6212!important;stroke:#365314!important;color:#fffdf8!important;}#pra .perform ellipse{fill:#3f6212!important;stroke:#365314!important;color:#fffdf8!important;}#pra .perform circle{fill:#3f6212!important;stroke:#365314!important;color:#fffdf8!important;}#pra .perform path{fill:#3f6212!important;stroke:#365314!important;color:#fffdf8!important;}#pra .perform tspan{fill:#fffdf8!important;}#pra .memory rect{fill:#fffdf8!important;stroke:#1e3a5f!important;color:#1c1917!important;stroke-width:2px!important;}#pra .memory polygon{fill:#fffdf8!important;stroke:#1e3a5f!important;color:#1c1917!important;stroke-width:2px!important;}#pra .memory ellipse{fill:#fffdf8!important;stroke:#1e3a5f!important;color:#1c1917!important;stroke-width:2px!important;}#pra .memory circle{fill:#fffdf8!important;stroke:#1e3a5f!important;color:#1c1917!important;stroke-width:2px!important;}#pra .memory path{fill:#fffdf8!